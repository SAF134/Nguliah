name: nguliah
description: "Aplikasi Android manajemen akademik mahasiswa offline-first: Nilai, Jadwal, Tugas, Acara."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  isar_community: ^3.4.1
  isar_community_flutter_libs: ^3.4.1
  path_provider: ^2.1.6
  go_router: ^18.1.1
  fl_chart: ^1.3.0
  table_calendar: ^3.3.0
  flutter_local_notifications: ^22.3.3
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.1
  image_picker: ^1.2.4
  file_picker: ^13.3.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  isar_community_generator: ^3.4.1

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
